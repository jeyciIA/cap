name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/agente/celu app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "agente"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.agente.celu"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.agente.celu"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="Agente" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AgentService" android:exported="false" android:label="Agente"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/desc"
              android:notificationTimeout="100"/>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="desc">Permite que el agente vea la pantalla y toque por vos</string>
          </resources>
          EOF
          cat > app/src/main/java/com/agente/celu/MainActivity.kt <<'EOF'
          package com.agente.celu

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sp = getSharedPreferences("p", MODE_PRIVATE)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 100, 40, 40) }
                  fun edit(h: String, v: String) = EditText(this).apply { hint = h; setText(v) }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }
                  val key = edit("API key de Gemini", sp.getString("k", "") ?: "")
                  key.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  val model = edit("Modelo", sp.getString("m", "gemini-flash-latest") ?: "gemini-flash-latest")
                  val task = edit("¿Qué querés que haga?", "")
                  val log = TextView(this)
                  AgentService.onLog = { s -> runOnUiThread { log.append(s + "\n") } }
                  root.addView(btn("1) Activar accesibilidad") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  root.addView(key); root.addView(model); root.addView(task)
                  root.addView(btn("2) Empezar") {
                      sp.edit().putString("k", key.text.toString()).putString("m", model.text.toString()).apply()
                      val s = AgentService.instance
                      if (s == null) Toast.makeText(this, "Primero activá el servicio de accesibilidad", Toast.LENGTH_LONG).show()
                      else s.start(task.text.toString(), key.text.toString().trim(), model.text.toString().trim())
                  })
                  root.addView(btn("Parar") { AgentService.instance?.stop() })
                  root.addView(log)
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF
          cat > app/src/main/java/com/agente/celu/AgentService.kt <<'EOF'
          package com.agente.celu

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.os.Bundle
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          private const val SYS = """Sos un agente que maneja un celular Android mirando capturas de pantalla. Respondé SOLO un JSON con UNA acción por vez.
          Coordenadas normalizadas de 0 a 1000 (x horizontal, y vertical, origen arriba a la izquierda).
          Acciones: {"accion":"tocar","x":0,"y":0} | {"accion":"deslizar","x":0,"y":0,"x2":0,"y2":0} (para scroll) | {"accion":"escribir","texto":"...","enter":false} (antes tocá el campo) | {"accion":"abrir_app","app":"nombre"} | {"accion":"atras"} | {"accion":"inicio"} | {"accion":"recientes"} | {"accion":"esperar"} | {"accion":"terminar","mensaje":"resumen"}.
          Para abrir una app usá SIEMPRE abrir_app con el nombre que ves; nunca toques su ícono. Al tocar, apuntá al centro del elemento. Agregá siempre "razon" con una frase corta. Si la tarea ya está cumplida, usá terminar. Si algo falla varias veces, probá otro camino. Nunca compres, pagues, envíes mensajes ni borres datos salvo que la tarea lo pida explícitamente."""

          class AgentService : AccessibilityService() {
              companion object {
                  var instance: AgentService? = null
                  var onLog: ((String) -> Unit)? = null
              }

              @Volatile private var running = false

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(intent: Intent?): Boolean { running = false; instance = null; return super.onUnbind(intent) }

              private fun log(s: String) { onLog?.invoke(s) }
              fun stop() { running = false }

              fun start(task: String, key: String, model: String) {
                  if (running) return
                  running = true
                  Thread {
                      try { loop(task, key, model) } catch (e: Exception) { log("Error: ${e.message}") }
                      running = false
                      log("--- Fin ---")
                  }.start()
              }

              private fun loop(task: String, key: String, model: String) {
                  val history = ArrayList<String>()
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  Thread.sleep(1500)
                  for (step in 1..40) {
                      if (!running) { log("Detenido."); return }
                      val shot = screenshot()
                      if (shot == null) { log("No pude sacar la captura"); return }
                      val act = askGemini(task, history, shot, key, model)
                      if (act == null) return
                      val a = act.optString("accion")
                      log("$step) $a - ${act.optString("razon")}")
                      history.add(act.toString())
                      if (history.size > 8) history.removeAt(0)
                      if (a == "terminar") { log("Listo: " + act.optString("mensaje")); return }
                      try { doAction(act) } catch (e: Exception) { log("Fallo: ${e.message}") }
                      Thread.sleep(1500)
                  }
                  log("Llegué al límite de 40 pasos.")
              }

              private fun screenshot(): String? {
                  var result: String? = null
                  val latch = CountDownLatch(1)
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                      override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                          try {
                              val hw = Bitmap.wrapHardwareBuffer(r.hardwareBuffer, r.colorSpace)
                              if (hw != null) {
                                  val soft = hw.copy(Bitmap.Config.ARGB_8888, false)
                                  val w = 540
                                  val h = soft.height * w / soft.width
                                  val small = Bitmap.createScaledBitmap(soft, w, h, true)
                                  val out = ByteArrayOutputStream()
                                  small.compress(Bitmap.CompressFormat.JPEG, 70, out)
                                  result = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                              }
                              r.hardwareBuffer.close()
                          } catch (e: Exception) { log("Captura: ${e.message}") }
                          latch.countDown()
                      }
                      override fun onFailure(code: Int) { log("Captura falló ($code)"); latch.countDown() }
                  })
                  latch.await(10, TimeUnit.SECONDS)
                  return result
              }

              private fun askGemini(task: String, hist: List<String>, img: String, key: String, model: String): JSONObject? {
                  val prompt = "Tarea del usuario: $task\nAcciones ya hechas: ${hist.joinToString(" | ")}\nMirá la captura actual y devolvé la próxima acción."
                  val parts = JSONArray()
                      .put(JSONObject().put("text", prompt))
                      .put(JSONObject().put("inlineData", JSONObject().put("mimeType", "image/jpeg").put("data", img)))
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYS))))
                      .put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", parts)))
                      .put("generationConfig", JSONObject().put("responseMimeType", "application/json").put("temperature", 0.2))
                  for (intento in 1..6) {
                      val c = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent").openConnection() as HttpURLConnection
                      c.requestMethod = "POST"
                      c.connectTimeout = 20000
                      c.readTimeout = 60000
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("x-goog-api-key", key)
                      c.doOutput = true
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val ok = code in 200..299
                      val txt = (if (ok) c.inputStream else c.errorStream).bufferedReader().readText()
                      if (ok) {
                          var t = JSONObject(txt).getJSONArray("candidates").getJSONObject(0)
                              .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          t = t.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                          return JSONObject(t)
                      }
                      if (code == 429 || code == 503) { log("Gemini ocupado ($code), reintento $intento..."); Thread.sleep(10000); continue }
                      log("Gemini error $code: ${txt.take(200)}")
                      return null
                  }
                  log("Gemini no respondió.")
                  return null
              }

              private fun doAction(a: JSONObject) {
                  val w = resources.displayMetrics.widthPixels
                  val h = resources.displayMetrics.heightPixels
                  fun px(v: Double, max: Int) = (v / 1000.0 * max).toFloat()
                  when (a.optString("accion")) {
                      "tocar" -> gesture(px(a.optDouble("x"), w), px(a.optDouble("y"), h), null, null, 60)
                      "deslizar" -> gesture(px(a.optDouble("x"), w), px(a.optDouble("y"), h), px(a.optDouble("x2"), w), px(a.optDouble("y2"), h), 400)
                      "escribir" -> {
                          val n = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                          if (n == null) {
                              log("No hay un campo de texto activo")
                          } else {
                              val args = Bundle()
                              args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, a.optString("texto"))
                              n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                              if (a.optBoolean("enter")) {
                                  Thread.sleep(500)
                                  n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                              }
                          }
                      }
                      "abrir_app" -> openApp(a.optString("app"))
                      "atras" -> performGlobalAction(GLOBAL_ACTION_BACK)
                      "inicio" -> performGlobalAction(GLOBAL_ACTION_HOME)
                      "recientes" -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                      "esperar" -> Thread.sleep(3000)
                      else -> log("Acción desconocida")
                  }
              }

              private fun gesture(x1: Float, y1: Float, x2: Float?, y2: Float?, dur: Long) {
                  val p = Path()
                  p.moveTo(x1, y1)
                  if (x2 != null && y2 != null) p.lineTo(x2, y2)
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, dur)).build()
                  val latch = CountDownLatch(1)
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) { latch.countDown() }
                      override fun onCancelled(d: GestureDescription?) { log("Gesto cancelado"); latch.countDown() }
                  }, null)
                  latch.await(5, TimeUnit.SECONDS)
              }

              private fun openApp(name: String) {
                  val pm = packageManager
                  val list = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  val hit = list.firstOrNull { it.loadLabel(pm).toString().equals(name, true) }
                      ?: list.firstOrNull { val l = it.loadLabel(pm).toString(); l.contains(name, true) || name.contains(l, true) }
                  if (hit == null) { log("No encontré la app '$name'"); return }
                  val i = pm.getLaunchIntentForPackage(hit.activityInfo.packageName)
                  if (i != null) startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }
          EOF
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}-${{ github.run_attempt }}" app/build/outputs/apk/debug/app-debug.apk --title "Agente v${{ github.run_number }}" --notes "APK listo para instalar"
